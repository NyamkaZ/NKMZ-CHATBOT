<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>NKMZ Chat — офлайн</title>
  <style>
    /* Mirrors the workspace: black surface, neutral text, the light primary button. */
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
      background: #000; color: #f5f5f5;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 360px; }
    .brand { font-size: 25px; font-weight: 600; letter-spacing: -0.055em; }
    .brand i { font-family: Georgia, "Times New Roman", serif; font-weight: 400; color: #d4d4d4; }
    h1 { margin: 28px 0 8px; font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
    p { margin: 0; color: #a3a3a3; font-size: 13px; line-height: 1.7; }
    button {
      margin-top: 24px; height: 44px; width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
      background: #f5f5f5; color: #0a0a0a;
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #fff; }
    button:focus-visible { outline: 2px solid #d4d4d4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">NKMZ <i>Chat</i></div>
    <h1>Интернэт холболт алга</h1>
    <p>Холболтоо шалгаад дахин оролдоно уу. Таны чатууд хадгалагдсан хэвээр байгаа.</p>
    <p lang="en" style="margin-top: 10px">You’re offline. Check your connection and try again; your chats are safe.</p>
    <button type="button" onclick="location.reload()">Дахин оролдох · Retry</button>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
