services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_secret
      POSTGRES_DB: chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chatbot-net

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatbot-net

  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - chatbot-net
    restart: unless-stopped
    environment:
      # Only variables Ollama itself reads. Model name and num_predict live
      # on the backend service below.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
    # GPU: uncomment the next line on an NVIDIA host. On a CPU-only machine
    # 'gpus: all' makes `docker compose up` fail outright.
    # gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://chatbot:chatbot_secret@postgres:5432/chatbot
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_TEMPERATURE=0.7
      - OLLAMA_TOP_P=0.9
      - OLLAMA_NUM_PREDICT=4096
      - OLLAMA_CONTEXT_LENGTH=8192
      - QWEN_THINKING_MODE=no_think
      - SECRET_KEY=change-me-in-production-use-openssl-rand-hex-32
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - DAILY_MESSAGE_LIMIT=30
      - GUEST_MESSAGE_LIMIT=1
      - RATE_LIMIT_PER_MINUTE=10
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./knowledge_base:/app/knowledge_base
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1"
    networks:
      - chatbot-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    environment:
      # Empty so browser uses same-origin /api (rewritten to backend via next.config)
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - INTERNAL_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chatbot-net
    restart: unless-stopped

  # Optional dedicated generation worker.
  # Enable by setting USE_GENERATION_WORKER=1 on backend AND uncommenting this service.
  # worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: chatbot-worker
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://chatbot:chatbot_secret@postgres:5432/chatbot
  #     - REDIS_URL=redis://redis:6379/0
  #     - OLLAMA_BASE_URL=http://ollama:11434
  #     - OLLAMA_MODEL=qwen3:8b
  #     - SECRET_KEY=change-me-in-production-use-openssl-rand-hex-32
  #   volumes:
  #     - ./backend:/app
  #     - ./knowledge_base:/app/knowledge_base
  #   depends_on:
  #     - postgres
  #     - redis
  #     - ollama
  #   command: python -m app.workers.generation_worker
  #   networks:
  #     - chatbot-net
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  chatbot-net:
    driver: bridge
